[package]
name = "ivy-extension"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
