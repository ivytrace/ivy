name: Release

# Only pushes to main in this repository publish an image and trigger the optional downstream deploy.
# Pull requests (including from forks) only run ci.yml, which has no access to secrets.
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    if: github.repository == 'ivytrace/ivy'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ivy/layer build:web
      - name: Publish @ivytrace/lambda-web when its version is new
        working-directory: packages/layer/dist/web
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "@ivytrace/lambda-web@$version" version 2>/dev/null)" ]; then
            echo "@ivytrace/lambda-web@$version is already on npm"
            exit 0
          fi
          npm publish --access public

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ivy-api
            org.opencontainers.image.description=Ivy API and dashboard
          outputs: type=image,name=ghcr.io/ivytrace/ivy-api,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - id: ingest
        uses: docker/build-push-action@v7
        with:
          context: packages/ingest
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ivy-ingest
            org.opencontainers.image.description=Ivy OTLP ingest
          outputs: type=image,name=ghcr.io/ivytrace/ivy-ingest,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ingest-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ingest-${{ matrix.arch }}
      - name: Save digests
        run: |
          mkdir -p /tmp/digests/api /tmp/digests/ingest
          touch "/tmp/digests/api/${API#sha256:}" "/tmp/digests/ingest/${INGEST#sha256:}"
        env:
          API: ${{ steps.api.outputs.digest }}
          INGEST: ${{ steps.ingest.outputs.digest }}
      - uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tags
        working-directory: /tmp/digests
        run: |
          for image in api ingest; do
            docker buildx imagetools create \
              -t ghcr.io/ivytrace/ivy-$image:${{ github.sha }} \
              -t ghcr.io/ivytrace/ivy-$image:main \
              $(cd $image && printf "ghcr.io/ivytrace/ivy-$image@sha256:%s " *)
            docker buildx imagetools inspect ghcr.io/ivytrace/ivy-$image:${{ github.sha }}
          done

  dispatch-hosted:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger downstream deploy
        env:
          TOKEN: ${{ secrets.HOSTED_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOSTED_DISPATCH_TOKEN is not set; skipping the downstream deploy trigger"
            exit 0
          fi
          curl -fsS -X POST https://api.github.com/repos/ivytrace/ivy-hosted/dispatches \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\":\"ivy-main-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
