name: Release

# Only pushes to main in this repository publish an image and trigger the hosted deploy.
# Pull requests (including from forks) only run ci.yml, which has no access to secrets.
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    if: github.repository == 'ivytrace/ivy'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ivy-api
            org.opencontainers.image.description=Ivy API and dashboard
          outputs: type=image,name=ghcr.io/ivytrace/ivy-api,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/ivytrace/ivy-api:${{ github.sha }} \
            -t ghcr.io/ivytrace/ivy-api:main \
            $(printf 'ghcr.io/ivytrace/ivy-api@sha256:%s ' *)
          docker buildx imagetools inspect ghcr.io/ivytrace/ivy-api:${{ github.sha }}

  dispatch-hosted:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger ivytrace/ivy-hosted deploy
        env:
          TOKEN: ${{ secrets.HOSTED_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOSTED_DISPATCH_TOKEN is not set; skipping the hosted deploy trigger"
            exit 0
          fi
          curl -fsS -X POST https://api.github.com/repos/ivytrace/ivy-hosted/dispatches \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\":\"ivy-main-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
