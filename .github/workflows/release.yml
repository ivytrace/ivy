name: Release

# Only pushes to main in this repository publish an image and trigger the hosted deploy.
# Pull requests (including from forks) only run ci.yml, which has no access to secrets.
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    if: github.repository == 'ivytrace/ivy'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ivytrace/ivy-api:${{ github.sha }}
            ghcr.io/ivytrace/ivy-api:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ivy-api
            org.opencontainers.image.description=Ivy Trace API and dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch-hosted:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger ivytrace/ivy-hosted deploy
        env:
          TOKEN: ${{ secrets.HOSTED_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOSTED_DISPATCH_TOKEN is not set; skipping the hosted deploy trigger"
            exit 0
          fi
          curl -fsS -X POST https://api.github.com/repos/ivytrace/ivy-hosted/dispatches \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\":\"ivy-main-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
