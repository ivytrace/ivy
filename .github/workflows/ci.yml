name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs CI as part of release.yml
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/layer/extension
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/layer/extension
      - run: cargo test --locked

  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ingest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ingest
      - run: cargo test --locked
