name: ivy

x-clickhouse-env: &clickhouse-env
  IVY_CLICKHOUSE_USER: ${IVY_CLICKHOUSE_USER:-ivy}
  IVY_CLICKHOUSE_PASSWORD: ${IVY_CLICKHOUSE_PASSWORD:-ivy}
  IVY_CLICKHOUSE_URL: http://clickhouse:8123

x-api-build: &api-build
  context: ..
  dockerfile: packages/api/Dockerfile
  args:
    BUILD_UI: ${IVY_BUILD_UI:-auto}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.37.168-alpine
    environment:
      CLICKHOUSE_DB: ivy
      CLICKHOUSE_USER: ${IVY_CLICKHOUSE_USER:-ivy}
      CLICKHOUSE_PASSWORD: ${IVY_CLICKHOUSE_PASSWORD:-ivy}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      IVY_RETENTION_DAYS: ${IVY_RETENTION_DAYS:-30}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/ivy/schema.sql:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "${IVY_CLICKHOUSE_HTTP_PORT:-8123}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'EXISTS TABLE ivy_control.aws_project_rules' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  collector-volume-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/otelcol/file_storage"]
    volumes:
      - collector-queue:/var/lib/otelcol/file_storage

  # Internal only: no published ports. Clients send to the ingest router, which forwards here
  # with IVY_COLLECTOR_TOKEN and the tenant header (docs/implementation/tenancy.md).
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      <<: *clickhouse-env
      IVY_COLLECTOR_TOKEN: ${IVY_COLLECTOR_TOKEN:-dev-collector-token}
      IVY_CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - collector-queue:/var/lib/otelcol/file_storage
    depends_on:
      clickhouse: { condition: service_healthy }
      collector-volume-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Public OTLP/HTTP endpoint: API key → tenant → shard collector. Same image as the API.
  ingest:
    image: ivy-api:local
    build: *api-build
    command: ["node", "ingest.mjs"]
    environment:
      <<: *clickhouse-env
      IVY_COLLECTOR_URL: http://collector:4318
      IVY_COLLECTOR_TOKEN: ${IVY_COLLECTOR_TOKEN:-dev-collector-token}
      IVY_INGEST_API_KEY: ${IVY_INGEST_API_KEY:-dev-ingest-key}
      IVY_INGEST_TRUST_PROXY: ${IVY_INGEST_TRUST_PROXY:-}
      IVY_INGEST_MAX_BODY_BYTES: ${IVY_INGEST_MAX_BODY_BYTES:-}
      IVY_SHARDS: ${IVY_SHARDS:-}
    ports:
      - "${IVY_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4318/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      clickhouse: { condition: service_healthy }
      collector: { condition: service_started }
    restart: unless-stopped

  api:
    image: ivy-api:local
    build: *api-build
    environment:
      <<: *clickhouse-env
      IVY_CLICKHOUSE_DATABASE: ivy
      IVY_SHARDS: ${IVY_SHARDS:-}
      PORT: 3000
      # Dashboard/API sign-in (docs/implementation/auth.md); no issuer = auth disabled
      IVY_OIDC_ISSUER: ${IVY_OIDC_ISSUER:-}
      IVY_OIDC_CLIENT_ID: ${IVY_OIDC_CLIENT_ID:-}
      IVY_OIDC_AUDIENCE: ${IVY_OIDC_AUDIENCE:-}
      IVY_OIDC_SCOPES: ${IVY_OIDC_SCOPES:-}
      IVY_OIDC_ALLOW_AGENTS: ${IVY_OIDC_ALLOW_AGENTS:-}
      IVY_SINGLE_TENANT: ${IVY_SINGLE_TENANT:-}
      # Invitation emails (docs/implementation/workspaces-projects.md); unset = links to copy only
      IVY_SMTP_URL: ${IVY_SMTP_URL:-}
      IVY_EMAIL_FROM: ${IVY_EMAIL_FROM:-}
      # Executable hooks (docs/implementation/hooks.md); mount a directory there to use them
      IVY_HOOKS_DIR: ${IVY_HOOKS_DIR:-}
      # Tenancy and auto-trace (docs/implementation/tenancy.md, auto-trace.md)
      IVY_INGEST_API_KEY: ${IVY_INGEST_API_KEY:-dev-ingest-key}
      IVY_SECRET_KEY: ${IVY_SECRET_KEY:-}
      IVY_INGEST_PUBLIC_URL: ${IVY_INGEST_PUBLIC_URL:-}
      IVY_PUBLIC_URL: ${IVY_PUBLIC_URL:-}
      IVY_AWS_PRINCIPAL_ARN: ${IVY_AWS_PRINCIPAL_ARN:-}
      IVY_AWS_DEFAULT_REGION: ${IVY_AWS_DEFAULT_REGION:-}
      IVY_AWS_SYNC_INTERVAL_SECONDS: ${IVY_AWS_SYNC_INTERVAL_SECONDS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
    ports:
      - "${IVY_API_PORT:-3000}:3000"
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

volumes:
  clickhouse-data:
  collector-queue:
