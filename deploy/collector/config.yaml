# Internal-only collector for one cell. Clients never talk to it directly: the ingest router
# (packages/api/src/ingest.ts) authenticates their API key, then forwards the request here with
# the internal token, the resolved tenant in `x-ivy-tenant` and the key's project in `x-ivy-project`
# (docs/implementation/tenancy.md, workspaces-projects.md).
extensions:
  bearertokenauth:
    scheme: Bearer
    token: ${env:IVY_COLLECTOR_TOKEN}
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        auth:
          authenticator: bearertokenauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # Tenant and project come only from the router's headers: drop whatever the client put in
  # `ivy.tenant_id` / `ivy.project_id`, then set them from the request metadata.
  resource/tenant:
    attributes:
      - key: ivy.tenant_id
        action: delete
      - key: ivy.tenant_id
        from_context: metadata.x-ivy-tenant
        action: insert
      - key: ivy.project_id
        action: delete
      - key: ivy.project_id
        from_context: metadata.x-ivy-project
        action: insert
  # Spans without a tenant or project (no header) are dropped rather than stored under an empty one.
  filter/tenant:
    error_mode: propagate
    traces:
      span:
        - resource.attributes["ivy.tenant_id"] == nil or resource.attributes["ivy.tenant_id"] == ""
        - resource.attributes["ivy.project_id"] == nil or resource.attributes["ivy.project_id"] == ""
  batch:
    send_batch_size: 10000
    send_batch_max_size: 20000
    timeout: 2s

exporters:
  clickhouse:
    endpoint: ${env:IVY_CLICKHOUSE_ENDPOINT}
    username: ${env:IVY_CLICKHOUSE_USER}
    password: ${env:IVY_CLICKHOUSE_PASSWORD}
    database: ivy
    traces_table_name: otel_traces
    create_schema: false
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [bearertokenauth, file_storage, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, filter/tenant, batch]
      exporters: [clickhouse]
